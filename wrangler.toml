#:schema node_modules/wrangler/config-schema.json
name = "marioparty3web"
main = "cloudflare_worker.js"
compatibility_date = "2024-11-01"
workers_dev = true

# Static game assets (HTML, N64 Libretro WASM core, chunked Mario Party 3 ROM)
# Every file in ./public is <18 MiB to stay well under Cloudflare Workers' 25 MiB per-file limit
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/ws"]

# Durable Object binding for the global 4-Player Online Relay & Room Browser
[durable_objects]
bindings = [
  { name = "RELAY_HUB", class_name = "MarioParty3RelayHub" }
]

# SQLite-backed Durable Objects (100% compatible with Cloudflare Workers Free Plan, no credit card)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["MarioParty3RelayHub"]
